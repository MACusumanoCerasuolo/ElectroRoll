<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Página principal de ElectroRoll" />
    <meta
      name="author"
      content="Mauro Cusumano, Mauro Romo, Eliseo Perez, Ismael Perez, Belen Pomo"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
     <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>ElectroRoll | Registrarse</title>
  </head>
  <body>
    <header></header>
    <main class="container my-5">
      <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm" style="max-width: 500px; margin:auto;">
           <div class="card-body p-4">
              <h4 class="card-title">REGISTRARSE</h4>
              <p class="card-subtitle text-muted small mb-4">Regístrate para crear tu cuenta</p>
                <form>
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingNombre" placeholder="Ejemplo: Juan Pérez" required>
                <label for="floatingNombre">Nombre y apellido</label>
              </div>
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingUsuario" placeholder="Nombre de usuario" required>
                <label for="floatingUsuario">Nombre de usuario</label>
              </div>

              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
                <label for="floatingEmail">Email</label>
              </div>

              <div class="form-floating mb-3">
                <input type="tel" class="form-control" id="floatingTelefono" placeholder="Número de teléfono" required>
                <label for="floatingTelefono">Teléfono</label>
              </div>

              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingDomicilio" placeholder="Domicilio" required>
                <label for="floatingDomicilio">Domicilio</label>
              </div>

              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingCP" placeholder="Código postal" required>
                <label for="floatingCP">Código postal</label>
              </div>

              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPass" placeholder="Contraseña" required>
                <label for="floatingPass">Contraseña</label>
              </div>

              <button type="submit" class="btn btn-dark w-100 py-2 text-uppercase" style="letter-spacing: 1px;">Registrarse</button>
            </form>

           </div>
        </div>
      </div>
      </div>
  </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
