<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Página principal de ElectroRoll" />
    <meta
      name="author"
      content="Mauro Cusumano, Mauro Romo, Eliseo Perez, Ismael Perez, Belen Pomo"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
     <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/css/style.css">
    <title>ElectroRoll | Detalles del Producto</title>
  </head>
  <body>
    <header></header>
    <main></main>
    <footer></footer>

     <div
      class="modal fade login-modal"
      id="modal-login"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Iniciar sesión
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="container">
              <div class="row">
                <div class="col-5 d-none d-lg-inline-block">
                  <img
                    src="/img/login-img.png"
                    alt="Un celular y una persona"
                    class="img-fluid"
                  />
                </div>
                <div class="col-12 col-lg-7">
                  <form action="/pages/error404.html" method="get">
                    <div class="container">
                      <div class="row">
                        <div class="col-12 mb-3">
                          <div class="form-floating mb-3">
                            <input
                              type="email"
                              class="form-control"
                              id="login-email"
                              placeholder="name@example.com"
                              maxlength="60"
                              minlength="10"
                              required
                            />
                            <label for="login-email">
                              Correo electrónico
                            </label>
                          </div>
                        </div>
                        <div class="col-12 mb-3">
                          <div class="form-floating">
                            <input
                              type="password"
                              class="form-control"
                              id="login-password"
                              placeholder="Password"
                              maxlength="60"
                              minlength="12"
                              required
                            />
                            <label for="login-password">Contraseña</label>
                          </div>
                        </div>
                        <div class="col-12 mb-3">
                          <a
                            href="/pages/error404.html"
                            class="login-forgot-password"
                          >
                            ¿Olvidaste la contraseña?
                          </a>
                        </div>
                        <div class="col-12 mb-3 d-grid">
                          <button type="submit" class="btn btn-dark">
                            Iniciar sesion
                          </button>
                        </div>
                        <div class="col-12 text-center">
                          <a
                            href="/pages/register.html"
                            class="text-singup-login"
                          >
                            ¿No tienes una cuenta? Regístrate
                          </a>
                        </div>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <div class="container">
              <div class="row">
                <div
                  class="d-grid d-md-flex gap-3 col-12 justify-content-center"
                >
                  <a
                    href="https://www.google.com/"
                    class="btn btn-sm btn-outline-dark"
                    target="_blank"
                  >
                    Iniciar con google
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="currentColor"
                      class="bi bi-google icon-login-google"
                      viewBox="0 0 16 16"
                    >
                      <path
                        d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"
                      />
                    </svg>
                  </a>
                  <a
                    href="https://www.facebook.com/"
                    class="btn btn-sm btn-outline-dark"
                    target="_blank"
                  >
                    Iniciar con facebook
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="currentColor"
                      class="bi bi-facebook icon-login-facebook"
                      viewBox="0 0 16 16"
                    >
                      <path
                        d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"
                      />
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
